# ============================================================
# VPN Manager — Standalone Agent Docker Compose
# ============================================================
# This compose file is for running ONLY the agent on a VPN node
#
# Prerequisites:
#   1. VPN server must be installed and running on the host
#   2. VPN server must have management interface enabled
#   3. Node must be registered in Manager Web UI
#   4. .env file must be configured with credentials
#
# Usage:
#   docker compose up -d
#
# Network Mode:
#   Uses 'host' network mode because:
#   - Agent needs to connect to Manager API on external server
#   - No network isolation needed for standalone agent
#
#
# Security:
#   - Agent communicates via OpenVPN Management Interface
#   - Agent requires NET_ADMIN capability to configure iptables firewall policies
#
# ============================================================

services:
  agent:
    image: ghcr.io/adityadarma/vpn-agent:latest
    container_name: vpn-agent
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VPN_TOKEN: ${VPN_TOKEN:?VPN_TOKEN is required}
      VPN_TYPE: ${VPN_TYPE:-openvpn}
      AGENT_MANAGER_URL: ${AGENT_MANAGER_URL:?AGENT_MANAGER_URL is required}
      AGENT_NODE_ID: ${AGENT_NODE_ID:?AGENT_NODE_ID is required}
      AGENT_SECRET_TOKEN: ${AGENT_SECRET_TOKEN:?AGENT_SECRET_TOKEN is required}
      AGENT_POLL_INTERVAL_MS: ${AGENT_POLL_INTERVAL_MS:-5000}
      AGENT_HEARTBEAT_INTERVAL_MS: ${AGENT_HEARTBEAT_INTERVAL_MS:-30000}
      FIREWALL_ENGINE: ${FIREWALL_ENGINE:-auto}
      DNS_ENABLED: ${DNS_ENABLED:-false}
      COREDNS_CONFIG_DIR: /etc/vpn-manager/coredns
      COREDNS_HEALTH_URL: ${COREDNS_HEALTH_URL:-http://127.0.0.1:8181/health}
      DNS_BLOCK_DOT: ${DNS_BLOCK_DOT:-false}

    # Use host network for direct access to host VPN management interface and iptables bindings
    network_mode: host

    # Required for the agent to modify IP tables
    cap_add:
      - NET_ADMIN
      - NET_RAW

    # The Agent writes generated DNS revisions here. The volume remains harmless
    # when DNS_ENABLED=false and lets CoreDNS mount the same files read-only.
    volumes:
      - managed-dns:/etc/vpn-manager/coredns

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coredns:
    image: coredns/coredns:1.12.0
    profiles: ["dns"]
    restart: unless-stopped
    network_mode: host
    volumes:
      - managed-dns:/etc/coredns:ro
    command: -conf /etc/coredns/Corefile

volumes:
  managed-dns:
