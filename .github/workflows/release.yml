name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build (comma-separated: manager,agent or "all")'
        required: true
        default: 'all'
        type: string
      push_images:
        description: 'Push images to registry'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  MANAGER_IMAGE: vpn-manager
  AGENT_IMAGE: vpn-agent
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Verify the existing CI result ─────────────────────────────────────
  #
  # A release tag must point at a commit that CI has already tested after its
  # push to main. Re-running every test here wastes a second full CI run
  # and can give a different result for the same source. Instead, locate the
  # CI workflow run for this exact SHA on main, wait if it is still pending,
  # and only publish when that run concludes successfully.
  verify-ci:
    name: Verify Existing CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait for CI on this release commit
        run: |
          set -euo pipefail

          # A tag is immutable, so its SHA is the only safe CI lookup key.
          # We verify the CI run that executed on main for this exact commit.
          for attempt in $(seq 1 90); do
            response=$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=1")
            count=$(jq -r '.total_count' <<<"$response")

            if [ "$count" = "0" ]; then
              echo "No CI run found on main for ${GITHUB_SHA} yet (attempt ${attempt}/90)"
              sleep 10
              continue
            fi

            ci_status=$(jq -r '.workflow_runs[0].status' <<<"$response")
            ci_conclusion=$(jq -r '.workflow_runs[0].conclusion // empty' <<<"$response")
            url=$(jq -r '.workflow_runs[0].html_url' <<<"$response")
            echo "CI run on main: ${url} (${ci_status}${ci_conclusion:+, ${ci_conclusion}})"

            case "$ci_status" in
              completed)
                if [ "$ci_conclusion" = "success" ]; then
                  echo "CI succeeded on main for release commit ${GITHUB_SHA}"
                  exit 0
                fi
                echo "CI did not succeed on main for release commit ${GITHUB_SHA}: ${ci_conclusion}" >&2
                exit 1
                ;;
              queued|in_progress|waiting|requested|pending)
                sleep 10
                ;;
              *)
                echo "Unexpected CI status: ${ci_status}" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for CI on main for release commit ${GITHUB_SHA}" >&2
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  # ── Job 2: Prepare ──────────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-images.outputs.images }}
      should_build: ${{ steps.set-images.outputs.should_build }}
    steps:
      - name: Determine images to build
        id: set-images
        run: |
          IMAGES='["manager","agent"]'
          SHOULD_BUILD="true"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.images }}"
            if [ "$INPUT" != "all" ]; then
              IMAGES=$(echo "$INPUT" | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            fi
            SHOULD_BUILD="${{ inputs.push_images }}"
          fi

          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "Images: $IMAGES — Should build: $SHOULD_BUILD"

  # ── Job 3: Smoke-test the release image before publishing ───────────────────
  smoke-test-image:
    name: Smoke Test Image
    needs: [verify-ci, prepare]
    if: >
      needs.prepare.outputs.should_build == 'true' &&
      contains(needs.prepare.outputs.images, 'manager')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Build manager image locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:smoke
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}

      - name: Create test environment
        run: |
          cp .env.production .env
          sed -i 's/CHANGE_ME_TO_SECURE_RANDOM_STRING_MIN_32_CHARS/test-secret-key-for-ci-testing-only-32chars/' .env
          echo "VPN_TOKEN=test-vpn-token-for-ci" >> .env
          echo "ADMIN_PASSWORD=ci-deploy-test-admin-pw-32c!!" >> .env

      - name: Start manager image
        run: |
          docker tag ghcr.io/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:smoke \
            ghcr.io/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:latest
          docker compose -f docker-compose.prod.yml up -d manager

      - name: Check deployment health
        run: |
          echo "Waiting for API to be ready (max 2 min)..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              curl -sf http://localhost:3000 -o /dev/null -w "Web UI HTTP %{http_code}\n"
              exit 0
            fi
            echo "  attempt $i/24 — sleeping 5s"
            sleep 5
          done
          echo "Timeout — dumping logs"
          docker compose -f docker-compose.prod.yml logs manager
          exit 1

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs manager

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # ── Job 4: Build and publish versioned images ────────────────────────────────
  # A release publishes only after the locally built Manager image has passed its
  # smoke test. Only intended public tags are pushed: stable semver aliases or
  # one standalone prerelease tag. No SHA images are stored in GHCR.
  publish:
    name: Publish (${{ matrix.image }})
    needs: [prepare, smoke-test-image]
    if: >
      always() &&
      needs.prepare.outputs.should_build == 'true' &&
      (needs.smoke-test-image.result == 'success' || needs.smoke-test-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image-config
        run: |
          if [ "${{ matrix.image }}" = "manager" ]; then
            echo "image_name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.AGENT_IMAGE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version tags
        id: version-tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # A manual release from main may publish only :latest.
            VERSION=""
          fi

          IMG="${{ steps.image-config.outputs.image_name }}"
          TAGS=""
          if [ -n "$VERSION" ]; then
            # A prerelease gets its immutable version tag plus the moving beta
            # channel alias. It never moves :latest, :1, or :1.2.
            if [[ "$VERSION" == *-* ]]; then
              TAGS="$IMG:$VERSION,$IMG:beta"
            else
              MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              TAGS="$IMG:$VERSION,$IMG:$MAJOR_MINOR,$IMG:$MAJOR,$IMG:latest"
            fi
          elif [ "${{ github.ref_name }}" = "main" ]; then
            # main remains the source for manual image rebuilds. Release tags
            # determine whether the image is published as beta or latest.
            TAGS="$IMG:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-$(jq -r .version package.json)}" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - name: Build and publish version tags
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image == 'manager' && 'Dockerfile' || 'apps/agent/Dockerfile' }}
          push: true
          tags: ${{ steps.version-tags.outputs.tags }}
          # GHCR shows Buildx provenance/SBOM attestations as untagged sha256
          # package versions. This registry publishes only deployable tags.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.version-tags.outputs.version }}
            REVISION=${{ github.sha }}

      - name: Summary
        run: |
          echo "Image : ${{ steps.image-config.outputs.image_name }}"
          echo "Tags  : ${{ steps.version-tags.outputs.tags }}"
          echo "Version: ${{ steps.version-tags.outputs.version }}"

  # ── Job 5: Bump version + create GitHub Release (tag only) ──────────────────
  release:
    name: Release
    needs: [verify-ci, publish]
    if: >
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.verify-ci.result == 'success' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Agent binaries
        run: pnpm --filter @vpn/agent build:binary

      - name: Create Agent checksums
        run: |
          cd apps/agent/dist
          sha256sum vpn-agent-linux-amd64 > vpn-agent-linux-amd64.sha256
          sha256sum vpn-agent-linux-arm64 > vpn-agent-linux-arm64.sha256

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Bump version in package.json files
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          # Covers packages/* too — they were previously left out, so their
          # versions drifted behind the tag on every release.
          for pkg in apps/api/package.json apps/web/package.json apps/agent/package.json \
                     packages/db/package.json packages/shared/package.json packages/ui/package.json; do
            jq --arg v "$VERSION" '.version = $v' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done
          # Swagger reports the API version in its OpenAPI document.
          sed -i "s/version: '[0-9]\+\.[0-9]\+\.[0-9]\+'/version: '$VERSION'/" \
            apps/api/src/plugins/swagger.ts
          echo "Bumped all package.json to $VERSION"

      - name: Generate changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # Compare a stable release only with the preceding stable release.
          # A v2.0.0-beta.* tag must not shrink v2.0.0's changelog to the
          # handful of commits since that prerelease.
          PREV_TAG=$(git tag --merged "$TAG" --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -Fxv "$TAG" \
            | head -1 || true)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges)
          BODY="### Changes\n${COMMITS}\n\n"

          printf "$BODY" > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'v${{ steps.version.outputs.version }}'
          body_path: /tmp/changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          append_body: true
          files: |
            apps/agent/dist/vpn-agent-linux-amd64
            apps/agent/dist/vpn-agent-linux-amd64.sha256
            apps/agent/dist/vpn-agent-linux-arm64
            apps/agent/dist/vpn-agent-linux-arm64.sha256
          body: |
            ## Docker Images

            **Manager:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/vpn-manager:${{ steps.version.outputs.version }}
            ```

            **Agent:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/vpn-agent:${{ steps.version.outputs.version }}
            ```

            ### Install / Update
            ```bash
            # Install Manager
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-manager.sh | sudo bash

            # Update Node Agent
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/update-node.sh | sudo bash
            ```

            ### Native Agent

            Linux nodes can run the Agent without Docker or Node.js. The
            installer downloads the matching Bun binary and creates a systemd
            service. Existing native installs are updated in place while their
            `/opt/vpn-agent/.env` credentials are preserved.
