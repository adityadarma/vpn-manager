name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      images:
        description: 'Images to build (comma-separated: manager,agent or "all")'
        required: true
        default: 'all'
        type: string
      push_images:
        description: 'Push images to registry'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  MANAGER_IMAGE: vpn-manager
  AGENT_IMAGE: vpn-agent
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: Test ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: |
          pnpm --filter @vpn/api test
          pnpm --filter @vpn/agent test
        env:
          ADMIN_PASSWORD: ci-test-admin-password-32chars!!

  # ── Job 2: Prepare ──────────────────────────────────────────────────────────
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-images.outputs.images }}
      should_build: ${{ steps.set-images.outputs.should_build }}
    steps:
      - name: Determine images to build
        id: set-images
        run: |
          IMAGES='["manager","agent"]'
          SHOULD_BUILD="true"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.images }}"
            if [ "$INPUT" != "all" ]; then
              IMAGES=$(echo "$INPUT" | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            fi
            SHOULD_BUILD="${{ inputs.push_images }}"
          fi

          echo "images=$IMAGES" >> $GITHUB_OUTPUT
          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT
          echo "Images: $IMAGES — Should build: $SHOULD_BUILD"

  # ── Job 3: Build and publish versioned images ────────────────────────────────
  # CI builds only locally for smoke tests. A release builds the tagged source
  # once and publishes only intended public tags: stable semver aliases or one
  # standalone prerelease tag. No SHA images are stored in GHCR.
  publish:
    name: Publish (${{ matrix.image }})
    needs: [test, prepare]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.images) }}

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image-config
        run: |
          if [ "${{ matrix.image }}" = "manager" ]; then
            echo "image_name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.AGENT_IMAGE }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version tags
        id: version-tags
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # A manual release from main may publish only :latest.
            VERSION=""
          fi

          IMG="${{ steps.image-config.outputs.image_name }}"
          TAGS=""
          if [ -n "$VERSION" ]; then
            # A prerelease is intentionally standalone. For v1.2.0-beta.1,
            # publish only :1.2.0-beta.1: never move :latest, :1, or :1.2.
            if [[ "$VERSION" == *-* ]]; then
              TAGS="$IMG:$VERSION"
            else
              MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              TAGS="$IMG:$VERSION,$IMG:$MAJOR_MINOR,$IMG:$MAJOR,$IMG:latest"
            fi
          elif [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="$IMG:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Publishing: $TAGS"

      - name: Build and publish version tags
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.image == 'manager' && 'Dockerfile' || 'apps/agent/Dockerfile' }}
          push: true
          tags: ${{ steps.version-tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64

      - name: Summary
        run: |
          echo "Image : ${{ steps.image-config.outputs.image_name }}"
          echo "Tags  : ${{ steps.version-tags.outputs.tags }}"

  # ── Job 4: Smoke-test the deployed manager ──────────────────────────────────
  #
  # ci.yml smoke-tests a local image on each change. This second smoke test
  # pulls the newly published stable tag to verify the registry publish path.
  test-deployment:
    name: Smoke Test Deployment
    needs: [prepare, publish]
    if: >
      needs.prepare.outputs.should_build == 'true' &&
      contains(needs.prepare.outputs.images, 'manager') &&
      !contains(github.ref_name, '-') &&
      (github.event_name != 'workflow_dispatch' || inputs.push_images == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create test environment
        run: |
          cp .env.production .env
          sed -i 's/CHANGE_ME_TO_SECURE_RANDOM_STRING_MIN_32_CHARS/test-secret-key-for-ci-testing-only-32chars/' .env
          echo "VPN_TOKEN=test-vpn-token-for-ci" >> .env
          echo "ADMIN_PASSWORD=ci-deploy-test-admin-pw-32c!!" >> .env

      - name: Pull and start manager
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:latest
          docker tag  ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:latest \
                      ghcr.io/${{ github.repository_owner }}/${{ env.MANAGER_IMAGE }}:latest
          docker compose -f docker-compose.prod.yml up -d manager

      - name: Wait for manager to be healthy
        run: |
          echo "Waiting for API to be ready (max 2 min)..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "API ready after $((i*5))s"
              exit 0
            fi
            echo "  attempt $i/24 — sleeping 5s"
            sleep 5
          done
          echo "Timeout — dumping logs"
          docker compose logs manager
          exit 1

      - name: Check health endpoints
        run: |
          echo "=== API health ==="
          curl -sf http://localhost:3000/api/v1/health
          echo ""
          echo "=== Web UI ==="
          curl -sf http://localhost:3000 -o /dev/null -w "HTTP %{http_code}\n"

      - name: Logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml logs manager
          docker compose -f docker-compose.prod.yml ps

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # ── Job 5: Publish release documentation to GitHub Pages ────────────────────
  # Stable release tags are also the only tags that move Docker's :latest alias.
  # Deploy the documentation generated from that exact tag so Pages describes the
  # released product, not a later commit on main.
  deploy-docs:
    name: Deploy Documentation
    needs: [test, publish, test-deployment]
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') &&
      needs.test.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.test-deployment.result == 'success' || needs.test-deployment.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: pnpm --filter @vpn/docs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Job 6: Bump version + create GitHub Release (tag only) ──────────────────
  release:
    name: Release
    needs: [test, publish, test-deployment]
    if: >
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.test.result == 'success' &&
      needs.publish.result == 'success' &&
      (needs.test-deployment.result == 'success' || needs.test-deployment.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Bump version in package.json files
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          # Covers packages/* too — they were previously left out, so their
          # versions drifted behind the tag on every release.
          for pkg in apps/api/package.json apps/web/package.json apps/agent/package.json \
                     packages/db/package.json packages/shared/package.json packages/ui/package.json; do
            jq --arg v "$VERSION" '.version = $v' "$pkg" > tmp.json && mv tmp.json "$pkg"
          done
          # Swagger reports the API version in its OpenAPI document.
          sed -i "s/version: '[0-9]\+\.[0-9]\+\.[0-9]\+'/version: '$VERSION'/" \
            apps/api/src/plugins/swagger.ts
          echo "Bumped all package.json to $VERSION"

      - name: Generate changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="HEAD"
          fi

          FEATURES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^- feat" | head -20 || true)
          FIXES=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^- fix" | head -20 || true)
          SECURITY=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "^- (sec|security)" | head -20 || true)
          BREAKING=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -iE "BREAKING CHANGE|^- (feat|fix)!:" | head -10 || true)
          OTHER=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | grep -ivE "^- (feat|fix|chore|docs|style|refactor|test|ci|sec)" | head -10 || true)

          BODY=""
          [ -n "$BREAKING" ] && BODY="${BODY}### ⚠️ Breaking Changes\n${BREAKING}\n\n"
          [ -n "$SECURITY" ] && BODY="${BODY}### 🔒 Security\n${SECURITY}\n\n"
          [ -n "$FEATURES" ] && BODY="${BODY}### ✨ Features\n${FEATURES}\n\n"
          [ -n "$FIXES"    ] && BODY="${BODY}### 🐛 Bug Fixes\n${FIXES}\n\n"
          [ -n "$OTHER"    ] && BODY="${BODY}### 🔧 Other Changes\n${OTHER}\n\n"

          if [ -z "$BODY" ]; then
            ALL=$(git log $RANGE --pretty=format:"- %s (%h)" --no-merges | head -20 || true)
            BODY="### Changes\n${ALL}\n\n"
          fi

          printf "$BODY" > /tmp/changelog.md
          cat /tmp/changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 'v${{ steps.version.outputs.version }}'
          body_path: /tmp/changelog.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Docker Images

            **Manager:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/vpn-manager:${{ steps.version.outputs.version }}
            ```

            **Agent:**
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/vpn-agent:${{ steps.version.outputs.version }}
            ```

            ### Install / Update
            ```bash
            # Install Manager
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install-manager.sh | sudo bash

            # Update Node Agent
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/update-node.sh | sudo bash
            ```
