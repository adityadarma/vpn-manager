# ============================================================
# VPN Manager — Docker Compose (Production)
# ============================================================
# Single container: Fastify serves both API and Vite static UI
# Only one port exposed: 3000
#
# Usage:
#   docker compose up -d
# ============================================================

services:
  manager:
    image: ghcr.io/adityadarma/vpn-manager:${IMAGE_VERSION:-latest}
    container_name: vpn-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      HOST: "0.0.0.0"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      NODE_REGISTRATION_KEY: ${NODE_REGISTRATION_KEY}
      VPN_TOKEN: ${VPN_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - manager_data:/data
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:' + (process.env.PORT || 3000) + '/api/v1/health', response => process.exit(response.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vpn-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  vpn-network:
    driver: bridge

volumes:
  manager_data:
